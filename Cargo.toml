[package]
name = "evnx-crypto"
version = "0.1.2"
edition = "2021"
description = "Zero-knowledge encryption primitives for evnx cloud sync — Argon2id, AES-256-GCM, XChaCha20-Poly1305, X25519 ECDH and SRP-6a"
license = "MIT"
repository = "https://github.com/urwithajit9/evnx-crypto"
readme = "README.md"
keywords = ["cryptography", "zke", "env", "srp", "argon2"]
categories = ["cryptography", "authentication"]
# Verified by actually building on this toolchain, not guessed. 1.83 fails:
# zeroize_derive 1.5 requires edition2024, which needs 1.85.
rust-version = "1.85"
authors = ["Ajit Kumar <ajitkumar.pu@gmail.com>"]
homepage = "https://evnx.dev"

# cdylib is what wasm-bindgen links; rlib keeps native consumers (the CLI, the
# server) working unchanged. Both are produced, so nothing downstream changes.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Key derivation for password hashing 
argon2        = { version = "0.5", features = ["std"] }

# Authenticated encryption 
aes-gcm       = "0.10"
chacha20poly1305 = "0.10"

# Asymmetric cryptography 
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek  = { version = "2", features = ["static_secrets"] }

# Key derivation for ECDH shared secret 
hkdf          = "0.12"
sha2          = "0.10"

# Hashing 
blake3        = "1"

# SRP-6a implementation for password-authenticated key exchange
# NOTE: srp crate uses SHA-1 internally by default for legacy compat.
# We use it with SHA-256 via the generic interface.
srp           = "0.6"

# Randomness
rand          = { version = "0.8", features = ["std"] }
rand_core     = "0.6"

# Memory safety
zeroize       = { version = "1.7", features = ["derive"] }

# Serialization (for SRP state and keypair export)
serde         = { version = "1", features = ["derive"] }
base64ct      = { version = "1", features = ["alloc"] }

# Error handling
thiserror     = "1"

# Hex encoding — SRP verifier is transmitted as hex, not base64
hex           = "0.4"

# Browser bindings — optional, pulled in only by the `wasm` feature.
wasm-bindgen  = { version = "0.2", optional = true }

# ─── WebAssembly ────────────────────────────────────────────────────────────
# getrandom refuses to build for wasm32-unknown-unknown unless told where entropy
# comes from, because the target has no ambient OS RNG. The "js" feature routes it
# to crypto.getRandomValues() in the browser. Declared here as a direct dependency
# even though we only use it through `rand`, because feature selection cannot be
# expressed on a transitive dependency any other way — this is the documented fix.
#
# Target-scoped, so native builds are byte-for-byte unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest      = "1"
# Already regular dependencies; repeated here so the adversarial tests can drive
# the SRP server half directly when checking the client's M2 verification.
srp           = "0.6"
sha2          = "0.10"
hkdf          = "0.12"

[features]
# Exposes `from_bytes_for_test` constructors that bypass the KDF. Required to run
# this crate's own test suite; never enable it in a dependent.
test-utils = []

# Browser bindings for the evnx web dashboard. Enables wasm-bindgen and the
# `wasm` module. Deliberately NOT default: native consumers must not pay for it.
#
# Note this feature does NOT enable `test-utils`. The bindings hand out opaque
# key handles obtained only by generation or authenticated unwrap, never from
# caller-supplied bytes — the same invariant the crate enforces natively.
wasm = ["dep:wasm-bindgen"]

# [[bench]]
# name = "kdf_bench"
# harness = false

# [[bench]]
# name = "crypto_bench"
# harness = false