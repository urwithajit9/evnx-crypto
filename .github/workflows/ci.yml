# .github/workflows/ci.yml

name: evnx-crypto CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Increase proptest iterations in CI for better coverage
  PROPTEST_CASES: 500

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        # --all-targets so tests are linted too, --all-features so `test-utils`
        # is exercised rather than silently rotting.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all tests
        # test-utils gates the from_bytes_for_test constructors the suite needs.
        run: cargo test --all-features

      - name: Adversarial tests
        run: cargo test --test attacks --all-features -- --nocapture

      - name: Run integration tests explicitly
        run: cargo test --test integration --all-features -- --nocapture

      - name: Documentation builds (docs.rs runs this)
        run: cargo doc --no-deps --all-features

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep this in step with `rust-version` in Cargo.toml. Declaring an MSRV
      # without building on it is just a guess.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  bench:
    name: Benchmark KDF timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run KDF benchmark
        run: cargo test --test kdf benchmark_derive_master_key -- --ignored --nocapture
        # Expected output: ~300-500ms on GitHub Actions runners
        # Fail if > 2000ms (system too slow) or < 50ms (parameters too weak)