# .github/workflows/publish-wasm.yml
#
# Publishes @evnx/crypto-wasm to npm — the browser build of this crate, consumed
# by the dashboard at app.evnx.dev.
#
# Runs here rather than locally because npm's auth is easy to get wrong by hand:
# npm does NOT read NODE_AUTH_TOKEN on its own. It only picks the token up
# because `actions/setup-node` writes an .npmrc containing
#
#     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
#
# Without that line the variable is ignored entirely and npm reports ENEEDAUTH —
# which looks like a bad token when the token is fine.

name: Publish @evnx/crypto-wasm

on:
  # Tagging the crate publishes the matching wasm package.
  push:
    tags: ["v*"]
  # Manual runs, for republishing after a failure without cutting a new tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate, but do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # registry-url is what makes setup-node write the .npmrc that expands
      # NODE_AUTH_TOKEN. Without it, every publish below fails on auth.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@evnx"

      - name: Build the package
        run: ./scripts/build-wasm.sh

      # The version comes from Cargo.toml via wasm-pack. A tagged run must agree
      # with its tag, or the published package silently carries a different
      # version from the crate it was built out of.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./pkg/package.json').version")
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG — bump Cargo.toml"
            exit 1
          fi

      # npm rejects a republish of an existing version, but what that MEANS
      # depends on why the run is here:
      #
      #   * the ref is the tag for this exact version, and it is already live —
      #     the tag's goal is met. This is what a re-run after a spurious
      #     "Wait for the registry" failure looks like (it happened on v0.1.1),
      #     and it must finish green rather than fail on a conflict.
      #   * anything else — Cargo.toml was not bumped. Stop and say so.
      - name: Check the registry
        id: check
        run: |
          PKG=$(node -p "require('./pkg/package.json').version")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

          if ! npm view "@evnx/crypto-wasm@$PKG" version >/dev/null 2>&1; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On a non-tag ref this expansion leaves GITHUB_REF untouched
          # (refs/heads/main), which never equals a version — so a plain
          # workflow_dispatch still fails on an unbumped version.
          if [ "${GITHUB_REF#refs/tags/v}" = "$PKG" ]; then
            echo "::notice::@evnx/crypto-wasm@$PKG is already live — nothing to publish for this tag."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::@evnx/crypto-wasm@$PKG is already published. Versions are immutable — bump Cargo.toml."
          exit 1

      - name: Validate the package (dry run)
        if: steps.check.outputs.already_published != 'true'
        run: |
          cat pkg/package.json
          (cd pkg && npm publish --dry-run --access public)

      - name: Publish
        if: ${{ !inputs.dry_run && steps.check.outputs.already_published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # No `|| true` and no `|| echo` here, deliberately. Swallowing a failed
        # publish is exactly what made an expired token look like a green run
        # when @evnx/cli was released.
        run: (cd pkg && npm publish --access public --provenance)

      # npm's publish pipeline is asynchronous: the package is accepted before it
      # is queryable.
      #
      # This poll reports VISIBILITY, and visibility is not the success signal —
      # `npm publish` returning 0 is, and the step above has no `|| true`, so a
      # genuine publish failure already fails the job. On v0.1.1 the package took
      # longer than five minutes to appear and this step failed a release that
      # had in fact published, which then sent the re-run into the
      # already-published guard. So: a longer budget, and a timeout that WARNS.
      - name: Wait for the registry
        id: wait
        if: ${{ !inputs.dry_run && steps.check.outputs.already_published != 'true' }}
        run: |
          V="${{ steps.check.outputs.version }}"
          for i in $(seq 1 40); do
            if npm view "@evnx/crypto-wasm@$V" version >/dev/null 2>&1; then
              echo "✓ @evnx/crypto-wasm@$V is live (after $((i * 15))s)"
              echo "visible=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  not visible yet, attempt $i/40"
            sleep 15
          done
          echo "visible=false" >> "$GITHUB_OUTPUT"
          echo "::warning::@evnx/crypto-wasm@$V was published but is not visible after 10 minutes. This is registry lag, not a failed publish — confirm with: npm view @evnx/crypto-wasm@$V version"

      - name: Summary
        if: always()
        run: |
          {
            echo "### @evnx/crypto-wasm"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.check.outputs.version }}\` |"
            echo "| dry run | \`${{ inputs.dry_run || false }}\` |"
            if [ "${{ steps.check.outputs.already_published }}" = "true" ]; then
              echo "| outcome | already live — nothing published |"
            elif [ "${{ steps.wait.outputs.visible }}" = "false" ]; then
              echo "| outcome | published; not yet visible on the registry |"
            elif [ "${{ steps.wait.outputs.visible }}" = "true" ]; then
              echo "| outcome | published and live |"
            fi
            echo "| wasm | \`$(stat -c%s pkg/*_bg.wasm 2>/dev/null || echo '?') bytes\` |"
          } >> "$GITHUB_STEP_SUMMARY"
